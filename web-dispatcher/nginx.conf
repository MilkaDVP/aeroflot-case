# Раздача статики веб-диспетчера.
#
# Никакого проксирования к API здесь нет намеренно: браузер обращается
# к серверу напрямую по адресу из js/config.js. Так видно, что клиент
# и сервер — независимые компоненты, и клиент можно открыть хоть
# с флешки, указав адрес сервера параметром ?api=.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML не кэшируем: во время демонстрации правки должны быть видны
    # сразу, без объяснений жюри про Ctrl+F5.
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Снимок подложки грузится со стороннего сервера тайлов. Referrer
    # обрезается до источника: адрес внутреннего стенда наружу не уходит.
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
