<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вход — Диспетчеризация ОТО</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%230b0f14"/><circle cx="16" cy="16" r="7" fill="%233d8bfd"/></svg>'>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-screen">
    <form class="auth-box" id="login-form">
      <h1 class="auth-title">Диспетчеризация ОТО воздушных судов</h1>
      <p class="auth-subtitle">Рабочее место диспетчера. Вход по учётной записи.</p>

      <div class="auth-field">
        <label for="login">Логин</label>
        <input id="login" name="login" autocomplete="username" autofocus required>
      </div>

      <div class="auth-field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>

      <div id="error" class="error" hidden></div>

      <div class="auth-actions">
        <button type="submit" class="primary" id="submit">Войти</button>
      </div>

      <p class="auth-hint">
        Демонстрационные учётные записи:
        <code>dispatcher / dispatcher</code>,
        <code>supervisor / supervisor</code>
      </p>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
