<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вход — Диспетчеризация ОТО</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%230b0f14"/><circle cx="16" cy="16" r="7" fill="%233d8bfd"/></svg>'>
  <script src="js/theme-switch.js?v=__BUILD__"></script>
  <link rel="stylesheet" href="css/theme.css?v=__BUILD__">
  <link rel="stylesheet" href="css/auth.css?v=__BUILD__">
  <link rel="stylesheet" href="css/aeroflot-themes.css?v=__BUILD__">
</head>
<body>
  <main class="auth-screen">
    <form class="auth-box" id="login-form">
      <h1 class="auth-title">Диспетчеризация ОТО воздушных судов</h1>
      <p class="auth-subtitle">Рабочее место диспетчера. Вход по учётной записи.</p>

      <div class="auth-field">
        <label for="login">Логин</label>
        <input id="login" name="login" autocomplete="username" autofocus required>
      </div>

      <div class="auth-field">
        <label for="password">Пароль</label>
        <span class="password-field"><input id="password" name="password" type="password"
               autocomplete="current-password" required><button type="button" class="password-toggle" aria-controls="password" aria-label="Показать пароль" aria-pressed="false" onclick="const field=document.getElementById(this.getAttribute('aria-controls'));const show=field.type==='password';field.type=show?'text':'password';this.setAttribute('aria-pressed',show);this.setAttribute('aria-label',show?'Скрыть пароль':'Показать пароль')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <g class="eye-open"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></g>
            <g class="eye-closed"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></g>
          </svg></button></span>
      </div>

      <div id="error" class="error" hidden></div>

      <div class="auth-actions">
        <button type="submit" class="primary" id="submit">Войти</button>
      </div>

    </form>
  </main>

  <script src="js/config.js?v=__BUILD__"></script>
  <script src="js/api.js?v=__BUILD__"></script>
  <script src="js/login.js?v=__BUILD__"></script>
</body>
</html>
