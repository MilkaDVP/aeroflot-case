# Раздача PWA инженера.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker не кэшируется браузером: иначе обновление приложения
    # застрянет на старой версии оболочки, и инженер будет работать
    # по прошлогоднему коду, не зная об этом.
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /manifest.json {
        add_header Cache-Control "no-store";
        types { } default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
